name: Build Tools

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'tools-v*'
      - 'v*'

jobs:
  build-dex:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android Build-Tools
        run: |
          BUILD_TOOLS_DIR=$(ls -d ${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/build-tools/* | sort -V | tail -n 1)
          echo "Using Android Build-Tools: $BUILD_TOOLS_DIR"
          echo "$BUILD_TOOLS_DIR" >> $GITHUB_PATH
          echo "BUILD_TOOLS_DIR=$BUILD_TOOLS_DIR" >> $GITHUB_ENV

      - name: Build APKEditor.dex.jar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download --repo REAndroid/APKEditor --pattern "*.jar" --dir ./dl_apkeditor
          JAR_FILE=$(ls ./dl_apkeditor/*.jar | head -n 1)
          mv "$JAR_FILE" ./apkeditor.jar
          mkdir -p ./tmp_apkeditor
          unzip -q apkeditor.jar -x "*.class" "META-INF/*.SF" "META-INF/*.RSA" -d ./tmp_apkeditor 2>/dev/null || true
          d8 --min-api 26 --output ./tmp_apkeditor apkeditor.jar
          (cd ./tmp_apkeditor && zip -r -9 ../apkeditor.dex.jar .)
          sha256sum apkeditor.dex.jar | awk '{print $1}' > apkeditor.dex.jar.sha256
          rm -rf ./tmp_apkeditor ./dl_apkeditor

      - name: Build ubersigner.dex.jar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download --repo patrickfav/uber-apk-signer --pattern "*uber-apk-signer*.jar" --dir ./dl_ubersigner
          JAR_FILE=$(ls ./dl_ubersigner/*.jar | head -n 1)
          mv "$JAR_FILE" ./ubersigner.jar
          mkdir -p ./tmp_ubersigner
          unzip -q ubersigner.jar -x "*.class" "META-INF/*.SF" "META-INF/*.RSA" -d ./tmp_ubersigner 2>/dev/null || true

          # Convert embedded debug.keystore from JKS to BKS (Android Dalvik/ART requirement)
          curl -sLo ./bcprov.jar https://repo1.maven.org/maven2/org/bouncycastle/bcprov-jdk18on/1.78.1/bcprov-jdk18on-1.78.1.jar

          KS_PATH=$(find ./tmp_ubersigner -name "debug.keystore" | head -n 1)
          if [ -n "$KS_PATH" ]; then
            echo "Converting embedded debug.keystore to BKS format at: $KS_PATH"
            keytool -importkeystore \
              -srckeystore "$KS_PATH" \
              -srcstorepass android \
              -srckeypass android \
              -destkeystore "${KS_PATH}.bks" \
              -deststoretype BKS \
              -deststorepass android \
              -destkeypass android \
              -providerclass org.bouncycastle.jce.provider.BouncyCastleProvider \
              -providerpath ./bcprov.jar \
              -noprompt || true
            if [ -f "${KS_PATH}.bks" ]; then
              mv "${KS_PATH}.bks" "$KS_PATH"
              echo "Converted to BKS successfully."
            fi
          fi

          # Ensure debug.keystore exists and is valid BKS
          if [ ! -f "$KS_PATH" ] || ! keytool -list -keystore "$KS_PATH" -storetype BKS -storepass android -providerclass org.bouncycastle.jce.provider.BouncyCastleProvider -providerpath ./bcprov.jar >/dev/null 2>&1; then
            mkdir -p ./tmp_ubersigner
            KS_PATH="./tmp_ubersigner/debug.keystore"
            echo "Generating fresh BKS debug.keystore at $KS_PATH..."
            rm -f "$KS_PATH"
            keytool -genkeypair -v \
              -keystore "$KS_PATH" \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storetype BKS \
              -providerclass org.bouncycastle.jce.provider.BouncyCastleProvider \
              -providerpath ./bcprov.jar \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          d8 --min-api 26 --output ./tmp_ubersigner ubersigner.jar
          (cd ./tmp_ubersigner && zip -r -9 ../ubersigner.dex.jar .)
          sha256sum ubersigner.dex.jar | awk '{print $1}' > ubersigner.dex.jar.sha256
          rm -rf ./tmp_ubersigner ./dl_ubersigner ./bcprov.jar

      - name: Build apktool.dex.jar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download --repo iBotPeaches/Apktool --pattern "*.jar" --dir ./dl_apktool
          JAR_FILE=$(ls ./dl_apktool/*.jar | head -n 1)
          mv "$JAR_FILE" ./apktool.jar
          mkdir -p ./tmp_apktool
          unzip -q apktool.jar -x "*.class" "META-INF/*.SF" "META-INF/*.RSA" -d ./tmp_apktool 2>/dev/null || true
          d8 --min-api 26 --output ./tmp_apktool apktool.jar
          (cd ./tmp_apktool && zip -r -9 ../apktool.dex.jar .)
          sha256sum apktool.dex.jar | awk '{print $1}' > apktool.dex.jar.sha256
          rm -rf ./tmp_apktool ./dl_apktool

      - name: Build apksigner.dex.jar
        run: |
          mkdir -p ./tmp_apksigner
          unzip -q "$BUILD_TOOLS_DIR/lib/apksigner.jar" -x "*.class" "META-INF/*.SF" "META-INF/*.RSA" -d ./tmp_apksigner 2>/dev/null || true
          d8 --min-api 26 --output ./tmp_apksigner "$BUILD_TOOLS_DIR/lib/apksigner.jar"
          (cd ./tmp_apksigner && zip -r -9 ../apksigner.dex.jar .)
          sha256sum apksigner.dex.jar | awk '{print $1}' > apksigner.dex.jar.sha256
          rm -rf ./tmp_apksigner

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'tools-v1' }}
          name: "DexTools Binaries (${{ github.ref_type == 'tag' && github.ref_name || 'tools-v1' }})"
          files: |
            *.dex.jar
            *.dex.jar.sha256
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
