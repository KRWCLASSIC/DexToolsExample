name: Build Tools

on:
  workflow_dispatch:
  push:
    tags:
      - 'tools-v*'
      - 'v*'

jobs:
  build-dex:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android Build-Tools
        run: |
          BUILD_TOOLS_DIR=$(ls -d ${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/build-tools/* | sort -V | tail -n 1)
          echo "Using Android Build-Tools: $BUILD_TOOLS_DIR"
          echo "$BUILD_TOOLS_DIR" >> $GITHUB_PATH
          echo "BUILD_TOOLS_DIR=$BUILD_TOOLS_DIR" >> $GITHUB_ENV

      - name: Make package script executable
        run: chmod +x ./scripts/package-tool.sh

      - name: Build APKEditor.dex.jar
        run: |
          URL=$(curl -sL https://api.github.com/repos/REAndroid/APKEditor/releases/latest | jq -r '.assets[] | select(.name | endswith(".jar")) | .browser_download_url' | head -n 1)
          echo "Downloading APKEditor from: $URL"
          curl -sL "$URL" -o apkeditor.jar
          ./scripts/package-tool.sh apkeditor.jar apkeditor 26

      - name: Build ubersigner.dex.jar
        run: |
          URL=$(curl -sL https://api.github.com/repos/patrickfav/uber-apk-signer/releases/latest | jq -r '.assets[] | select(.name | endswith(".jar")) | .browser_download_url' | head -n 1)
          echo "Downloading uber-apk-signer from: $URL"
          curl -sL "$URL" -o ubersigner.jar
          ./scripts/package-tool.sh ubersigner.jar ubersigner 26

      - name: Build apktool.dex.jar
        run: |
          URL=$(curl -sL https://api.github.com/repos/iBotPeaches/Apktool/releases/latest | jq -r '.assets[] | select(.name | endswith(".jar")) | .browser_download_url' | head -n 1)
          echo "Downloading apktool from: $URL"
          curl -sL "$URL" -o apktool.jar
          ./scripts/package-tool.sh apktool.jar apktool 26

      - name: Build apksigner.dex.jar
        run: |
          cp "$BUILD_TOOLS_DIR/lib/apksigner.jar" ./apksigner.jar
          ./scripts/package-tool.sh apksigner.jar apksigner 26

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'tools-v1' }}
          name: "DexTools Binaries (${{ github.ref_type == 'tag' && github.ref_name || 'tools-v1' }})"
          files: |
            *.dex.jar
            *.dex.jar.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
