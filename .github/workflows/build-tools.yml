name: Build Tools

on:
  workflow_dispatch:
  push:
    tags:
      - 'tools-v*'
      - 'v*'

jobs:
  build-dex:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android Build-Tools
        run: |
          BUILD_TOOLS_DIR=$(ls -d ${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/build-tools/* | sort -V | tail -n 1)
          echo "Using Android Build-Tools: $BUILD_TOOLS_DIR"
          echo "$BUILD_TOOLS_DIR" >> $GITHUB_PATH
          echo "BUILD_TOOLS_DIR=$BUILD_TOOLS_DIR" >> $GITHUB_ENV

      - name: Build APKEditor.dex.jar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download --repo REAndroid/APKEditor --pattern "*.jar" --dir ./dl_apkeditor
          mv ./dl_apkeditor/*.jar ./apkeditor.jar
          d8 --min-api 26 --output apkeditor.dex.jar apkeditor.jar
          sha256sum apkeditor.dex.jar | awk '{print $1}' > apkeditor.dex.jar.sha256

      - name: Build ubersigner.dex.jar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download --repo patrickfav/uber-apk-signer --pattern "*uber-apk-signer*.jar" --dir ./dl_ubersigner
          mv ./dl_ubersigner/*.jar ./ubersigner.jar
          d8 --min-api 26 --output ubersigner.dex.jar ubersigner.jar
          sha256sum ubersigner.dex.jar | awk '{print $1}' > ubersigner.dex.jar.sha256

      - name: Build apktool.dex.jar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download --repo iBotPeaches/Apktool --pattern "*.jar" --dir ./dl_apktool
          mv ./dl_apktool/*.jar ./apktool.jar
          d8 --min-api 26 --output apktool.dex.jar apktool.jar
          sha256sum apktool.dex.jar | awk '{print $1}' > apktool.dex.jar.sha256

      - name: Build apksigner.dex.jar
        run: |
          d8 --min-api 26 --output apksigner.dex.jar "$BUILD_TOOLS_DIR/lib/apksigner.jar"
          sha256sum apksigner.dex.jar | awk '{print $1}' > apksigner.dex.jar.sha256

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'tools-v1' }}
          name: "DexTools Binaries (${{ github.ref_type == 'tag' && github.ref_name || 'tools-v1' }})"
          files: |
            *.dex.jar
            *.dex.jar.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
