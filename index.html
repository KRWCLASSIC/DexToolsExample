<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>DexTools</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div class="app">
    <!-- Header: Title and Quick Action Buttons In Line -->
    <header class="header">
      <div class="brand">
        <h1 class="brand-title">DexTools</h1>
      </div>
      <div class="quick-actions">
        <button class="btn btn-sm" id="btn-download-all">Download All</button>
        <button class="btn btn-sm btn-primary" id="btn-run-pipeline">Run</button>
      </div>
    </header>

    <!-- Configuration & Target -->
    <div class="card">
      <div class="card-title">Configuration & Target</div>
      <div class="grid-2">
        <div class="field">
          <label for="repo-input">Repository</label>
          <input id="repo-input" type="text" value="KRWCLASSIC/DexToolsExample" placeholder="owner/repo" />
        </div>
        <div class="field">
          <label for="tag-input">Release Tag</label>
          <input id="tag-input" type="text" value="tools-v1" placeholder="tools-v1" />
        </div>
      </div>
      <div class="field">
        <div class="field-label-row">
          <label for="input-path">Input APK Path</label>
          <button class="link-btn" id="btn-use-self">Reset to Self APK</button>
        </div>
        <input id="input-path" type="text" placeholder="Detecting base.apk..." />
      </div>
      <div class="field">
        <label for="output-path">Output Directory</label>
        <input id="output-path" type="text" placeholder="Detecting cache dir..." />
      </div>
    </div>

    <!-- Tools List -->
    <div class="tools-container" id="tools-list">
      <!-- Injected by main.ts with custom select dropdowns -->
    </div>

    <!-- Console -->
    <div class="console">
      <div class="console-bar">
        <span class="console-title">Console</span>
        <div class="console-actions">
          <button class="btn btn-xs" id="btn-clear">Clear</button>
          <button class="btn btn-xs btn-warn" id="btn-abort">Kill Process</button>
        </div>
      </div>
      <div class="console-output" id="console-body">
        <div class="log-neutral">[ready] process :dexrunner listening</div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
